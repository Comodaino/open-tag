server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Routes all requests to index.html for Flutter's internal routing
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets to improve load times
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
