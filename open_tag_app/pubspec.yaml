name: open_tag_app
description: "open-tag — Flutter starter app (desktop, web, android)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  flutter_blue_plus: ^2.3.12
  image: ^4.8.0
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true

icons_launcher:
  image_path: "assets/ot_logo_radius.png"
  platforms:
    android:
      enable: true
    linux:
      enable: true
    web:
      enable: true
