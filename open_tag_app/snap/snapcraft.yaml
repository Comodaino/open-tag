name: open_tag_app
version: 0.1.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-open_tag_app: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.open_tag_app # adjust accordingly to your app name

apps:
  open_tag_app:
    command: open_tag_app
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-open_tag_app
parts:
  open_tag_app:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
